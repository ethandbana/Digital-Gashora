<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Gashora | Teaching Computer Skills in Bugesera</title>
       <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #e0e0e0;
            background: #0a0a0a;
        }

        .header {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('images/photo3.png');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .header p {
            font-size: 20px;
            margin-bottom: 15px;
            color: #dddddd;
        }

        .tagline {
            font-size: 24px;
            font-style: italic;
            margin-top: 15px;
            color: #ffd54f;
        }

        .nav {
            background: #1a1a2e;
            text-align: center;
            padding: 15px;
            position: sticky;
            top: 0;
            border-bottom: 1px solid #ffd54f;
        }

        .nav a {
            color: #e0e0e0;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
            padding: 8px 16px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .nav a:hover {
            background: #ffd54f;
            color: #1a1a2e;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .section {
            background: #1e1e2e;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 1px solid #2a2a3e;
        }

        .section h2 {
            color: #ffd54f;
            margin-bottom: 20px;
            font-size: 32px;
            border-left: 5px solid #ffd54f;
            padding-left: 20px;
        }

        .section h3 {
            color: #ffd54f;
            margin: 20px 0 10px 0;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .skill-card {
            background: #2a2a3e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s;
            border: 1px solid #3a3a4e;
        }

        .skill-card:hover {
            transform: translateY(-5px);
            border-color: #ffd54f;
        }

        .skill-card h3 {
            color: #ffd54f;
            margin-bottom: 10px;
        }

        .skill-card p {
            color: #c0c0c0;
        }

        .quote {
            background: #2a2a3e;
            color: #e0e0e0;
            text-align: center;
            padding: 50px;
            border-radius: 15px;
            margin: 30px 0;
            border: 1px solid #ffd54f;
        }

        .quote p {
            font-size: 24px;
            font-style: italic;
            color: #ffd54f;
        }

        .quote-author {
            margin-top: 15px;
            font-size: 18px;
            color: #c0c0c0;
        }

        .gallery-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 25px;
        }

        .gallery-grid img {
            width: 250px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            border: 2px solid #3a3a4e;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .gallery-grid img:hover {
            transform: scale(1.05);
            border-color: #ffd54f;
        }

        .footer {
            background: #1a1a2e;
            color: #c0c0c0;
            text-align: center;
            padding: 30px;
            margin-top: 40px;
            border-top: 1px solid #ffd54f;
        }

        .button {
            display: inline-block;
            background: #ffd54f;
            color: #1a1a2e;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .button:hover {
            background: #ffca28;
            color: #0a0a0a;
        }

        .daily-log {
            margin-top: 50px;
            background: #2a2a3e;
            padding: 25px;
            border-radius: 15px;
            border-left: 4px solid #ffd54f;
        }

        .daily-log h3 {
            color: #ffd54f;
            margin-bottom: 15px;
        }

        .daily-log ul {
            line-height: 1.8;
            margin-left: 20px;
            color: #c0c0c0;
        }

        @media (max-width: 700px) {
            .header h1 { font-size: 32px; }
            .nav a { display: block; margin: 10px 0; }
            .gallery-grid img { width: 100%; height: auto; }
        }
</head>
<body>

    <div class="header">
        <h1>Digital Gashora</h1>
        <p>Gashora Centre, Bugesera | Rwanda</p>
        <div class="tagline">"One computer. Many minds. Big future."</div>
    </div>

    <div class="nav">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#what-we-teach">What We Teach</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
    </div>

    <div class="container">
        <div id="home" class="section">
            <h2>Welcome to Digital Gashora</h2>
            <p>We are teaching computer skills to children in Gashora Centre, Bugesera. With limited resources but unlimited determination, we believe every child deserves a chance to learn digital skills.</p>
            <p>Currently run by a Level 4 Computer Systems and Architecture student from ESSA Nyarugungaso, our program is hands-on, practical, and built for real learning.</p>
            <div class="quote">
                <p>"Technology opens opportunities. We open the door."</p>
                <div class="quote-author">— Digital Gashora</div>
            </div>
        </div>

        <div id="about" class="section">
            <h2>About Digital Gashora</h2>
            <p><strong>Who we are:</strong> We are a small but passionate computer literacy program based in Gashora Centre, Bugesera. What started as an internship has become a mission to bring digital skills to children who have limited access to computers.</p>
            <p><strong>Our story:</strong> I am a Level 4 Computer Systems student at ESSA Nyarugungaso. During my holiday internship, I was given the opportunity to manage Digital Gashora. With one computer and a group of eager learners, we are building something real.</p>
            <p><strong>Our challenge:</strong> Limited computers. Mixed skill levels. But we don't wait for perfect conditions — we teach with what we have.</p>
        </div>

        <div id="what-we-teach" class="section">
            <h2>What We Teach</h2>
            <div class="skills-grid">
                <div class="skill-card">
                    <h3>🖱️ Mouse Skills</h3>
                    <p>Clicking, double-clicking, right-click, moving the cursor</p>
                </div>
                <div class="skill-card">
                    <h3>⌨️ Keyboard Basics</h3>
                    <p>Typing, shortcuts (Ctrl+C, Ctrl+V, Ctrl+Z), volume control</p>
                </div>
                <div class="skill-card">
                    <h3>📁 File Management</h3>
                    <p>Creating folders, deleting files, organizing documents</p>
                </div>
                <div class="skill-card">
                    <h3>🖥️ Computer Basics</h3>
                    <p>Startup, shutdown, using the desktop, understanding icons</p>
                </div>
                <div class="skill-card">
                    <h3>📝 Typing Documents</h3>
                    <p>Using Notepad, saving files, typing sentences</p>
                </div>
                <div class="skill-card">
                    <h3>🔊 Sound & Display</h3>
                    <p>Volume control, mute/unmute, screen brightness</p>
                </div>
            </div>

            <div class="daily-log">
                <h3>📅 What We Learned This Week</h3>
                <ul>
                    <li><strong>Week 1, Day 1:</strong> Mouse skills - clicking, double-clicking, right-click</li>
                    <li><strong>Week 1, Day 2:</strong> Keyboard basics - volume control, mute/unmute</li>
                    <li><strong>Week 1, Day 3:</strong> Creating and deleting folders</li>
                    <li><strong>Week 1, Day 4:</strong> Using Notepad - typing and saving files</li>
                </ul>
                <p style="margin-top: 15px; font-style: italic;">✨ One computer. Many minds. Progress every day.</p>
            </div>
        </div>

        <div id="gallery" class="section">
            <h2>📸 Digital Gashora in Action</h2>
            <p>Real moments from our computer skills training in Gashora Centre.</p>
      <div class="gallery-grid" id="galleryGrid">
    <img src="images/photo1.png" alt="Teaching computer skills">

</div>

            <h2>Contact Us</h2>

    </div>

    <div class="footer">
        <p>&copy; 2026 Digital Gashora | Gashora Centre, Bugesera | Building digital skills for a better tomorrow</p>
        <p style="margin-top: 10px; font-size: 14px;">"One computer. Many minds. Big future."</p>
        <p style="margin-top: 15px; font-size: 12px;">Digital Gashora is an initiative of Journey House Actions Rwanda (JHA)</p>
    </div>

    <!-- Lightbox for clicking photos -->
<div id="lightbox" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; cursor: pointer; align-items: center; justify-content: center;">
    <img id="lightbox-img" style="max-width: 90%; max-height: 90%; object-fit: contain;">
</div>

<script>
    // Get all gallery images
    const galleryImages = document.querySelectorAll('.gallery-grid img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    // Add click to each image
    galleryImages.forEach(img => {
        img.style.cursor = 'pointer';
        img.addEventListener('click', function() {
            lightbox.style.display = 'flex';
            lightboxImg.src = this.src;
        });
    });

    // Close lightbox when clicked
    lightbox.addEventListener('click', function() {
        lightbox.style.display = 'none';
    });

    // Close with ESC key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lightbox.style.display === 'flex') {
            lightbox.style.display = 'none';
        }
    });
</script>


</body>
</html>
